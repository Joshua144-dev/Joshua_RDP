name: win 11

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure RDP
        shell: pwsh
        run: |
          Write-Host "Configuring Remote Desktop..."

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 1 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" `
            -Value 1 `
            -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null

          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          Restart-Service -Name TermService -Force

          Write-Host "RDP configured."

      - name: Create and Configure RDP User
        shell: pwsh
        run: |
          $username = "RDP"
          $password = "Joshua@123"

          Write-Host "Configuring RDP user..."

          $user = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if (-not $user) {
            Write-Host "Creating RDP user..."

            net user $username "$password" /add

            if ($LASTEXITCODE -ne 0) {
              Write-Host "ERROR: Failed to create RDP user."
              exit 1
            }
          }
          else {
            Write-Host "RDP user already exists."
          }

          # Force password every run
          net user $username "$password"

          if ($LASTEXITCODE -ne 0) {
            Write-Host "ERROR: Failed to set RDP password."
            exit 1
          }

          # Enable account
          net user $username /active:yes

          # Add permissions
          net localgroup Administrators $username /add 2>$null
          net localgroup "Remote Desktop Users" $username /add 2>$null

          # Password never expires
          Set-LocalUser `
            -Name $username `
            -PasswordNeverExpires $true

          Write-Host ""
          Write-Host "=============================="
          Write-Host "RDP USER READY"
          Write-Host "Username: RDP"
          Write-Host "Password: Joshua@123"
          Write-Host "=============================="

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest

      - name: Get Tailscale IP
        shell: pwsh
        run: |
          Write-Host "Finding Tailscale executable..."

          $tailscale = $null

          $possiblePaths = @(
            "$env:ProgramFiles\Tailscale\tailscale.exe",
            "$env:ProgramFiles\Tailscale IPN\tailscale.exe"
          )

          foreach ($path in $possiblePaths) {
            if (Test-Path $path) {
              $tailscale = $path
              break
            }
          }

          if (-not $tailscale) {
            $command = Get-Command tailscale.exe -ErrorAction SilentlyContinue

            if ($command) {
              $tailscale = $command.Source
            }
          }

          if (-not $tailscale) {
            Write-Host "Searching system for tailscale.exe..."

            $result = Get-ChildItem `
              "C:\" `
              -Filter "tailscale.exe" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($result) {
              $tailscale = $result.FullName
            }
          }

          if (-not $tailscale) {
            Write-Host "ERROR: tailscale.exe not found."
            exit 1
          }

          Write-Host "Using:"
          Write-Host $tailscale

          Start-Sleep -Seconds 5

          Write-Host "Tailscale status:"
          & $tailscale status

          $tailscaleIP = (
            & $tailscale ip -4 |
            Select-Object -First 1
          ).Trim()

          if ([string]::IsNullOrWhiteSpace($tailscaleIP)) {
            Write-Host "ERROR: No Tailscale IP assigned."
            exit 1
          }

          "TAILSCALE_IP=$tailscaleIP" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host ""
          Write-Host "=============================="
          Write-Host "TAILSCALE CONNECTED"
          Write-Host "IP: $tailscaleIP"
          Write-Host "=============================="

      - name: Verify RDP Service
        shell: pwsh
        run: |
          Write-Host "Checking Remote Desktop service..."

          $service = Get-Service TermService

          if ($service.Status -ne "Running") {
            Start-Service TermService
          }

          Start-Sleep -Seconds 2

          $listener = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $listener) {
            Write-Host "ERROR: Port 3389 is not listening."
            exit 1
          }

          Write-Host "RDP port 3389 is listening."

      - name: Verify RDP Accessibility
        shell: pwsh
        run: |
          Write-Host "Testing RDP connection..."

          $result = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389

          if (-not $result.TcpTestSucceeded) {
            Write-Host "ERROR: RDP is not reachable."
            exit 1
          }

          Write-Host "RDP connection test passed."

      - name: Prepare Downloads Script
        shell: pwsh
        run: |
          $rdpProfile = "C:\Users\RDP"

          $startupPath = Join-Path `
            $rdpProfile `
            "AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup"

          $downloadFile = Join-Path `
            $env:GITHUB_WORKSPACE `
            "Downloads.bat"

          if (-not (Test-Path $rdpProfile)) {
            New-Item `
              -ItemType Directory `
              -Path $rdpProfile `
              -Force |
              Out-Null
          }

          if (-not (Test-Path $startupPath)) {
            New-Item `
              -ItemType Directory `
              -Path $startupPath `
              -Force |
              Out-Null
          }

          if (Test-Path $downloadFile) {
            $targetPath = Join-Path `
              $startupPath `
              "Downloads.bat"

            Copy-Item `
              $downloadFile `
              -Destination $targetPath `
              -Force

            Write-Host "Downloads.bat copied."
          }
          else {
            Write-Host "Downloads.bat not found. Skipping."
          }

      - name: Show Connection Information
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "REMOTE DESKTOP READY"
          Write-Host "======================================"
          Write-Host ""
          Write-Host "Computer:"
          Write-Host $env:TAILSCALE_IP
          Write-Host ""
          Write-Host "Username:"
          Write-Host ".\RDP"
          Write-Host ""
          Write-Host "Password:"
          Write-Host "Joshua@123"
          Write-Host ""
          Write-Host "======================================"

      - name: Keep Runner Alive
        shell: pwsh
        run: |
          Write-Host "Runner will stay active until cancelled or timeout."

          while ($true) {
            $time = Get-Date -Format "yyyy-MM-dd HH:mm:ss"

            Write-Host "[$time] RDP available at $env:TAILSCALE_IP"

            Start-Sleep -Seconds 300
          }
