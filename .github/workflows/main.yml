name: win 11

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Create RDP User with Fixed Password
        run: |
          net user RDP Joshua@123 /add
          net localgroup Administrators RDP /add
          net localgroup "Remote Desktop Users" RDP /add
          echo "RDP_CREDS=User: RDP | Password: Joshua@123" >> %GITHUB_ENV%

      - name: Install Tailscale
        shell: cmd
        run: |
          curl -L -o "%TEMP%\tailscale.msi" "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          msiexec.exe /i "%TEMP%\tailscale.msi" /quiet /norestart
          del "%TEMP%\tailscale.msi"

      - name: Establish Tailscale Connection
        shell: cmd
        run: |
          "%ProgramFiles%\Tailscale\tailscale.exe" up --authkey=\${{ secrets.TAILSCALE_AUTHKEY }} --hostname=gh-runner-%GITHUB_RUN_ID%
          
          set TAILSCALE_IP=
          for /f "tokens=*" %%i in ('"%ProgramFiles%\Tailscale\tailscale.exe" ip -4') do set TAILSCALE_IP=%%i
          
          if "%TAILSCALE_IP%"=="" (
              echo Error: Tailscale IP not assigned.
              exit /b 1
          )
          
          echo TAILSCALE_IP=%TAILSCALE_IP% >> %GITHUB_ENV%
          echo Assigned Tailscale IP: %TAILSCALE_IP%

      - name: Verify RDP Accessibility
        shell: cmd
        run: |
          powershell -Command "\$res = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389; if (-not$res.TcpTestSucceeded) { exit 1 }"

      - name: Maintain Connection + Watch RDP User
        shell: pwsh
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: Joshua@123"
          Write-Host "==================`n"

          \$rdpProfile = "C:\Users\RDP"
          $startupPath = "$rdpProfile\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup"
          $downloadFile = "$env:GITHUB_WORKSPACE\Downloads.bat"
          $targetPath = "$startupPath\Downloads.bat"

          while (\$true) {
              if (Test-Path \$rdpProfile) {
                  try {
                      if (-not (Test-Path \$startupPath)) {
                          New-Item -ItemType Directory -Path \$startupPath -Force | Out-Null
                      }

                      if (Test-Path \$downloadFile) {
                          Copy-Item $downloadFile -Destination$targetPath -Force
                          Write-Host "✅ Downloads.bat copied to \$targetPath"
                      } else {
                          Write-Host "⚠️ Warning: Downloads.bat not found in repository root workspace."
                      }

                      if (Test-Path \$targetPath) {
                          cmd /c \$targetPath
                          Write-Host "✅ Downloads.bat executed successfully"
                      }
                      break
                  }
                  catch {
                      Write-Host "❌ Error: $($_.Exception.Message)"
                      break
                  }
              }
              else {
                  Write-Host "[\$(Get-Date)] Waiting for RDP profile to be created..."
                  Start-Sleep -Seconds 30
              }
          }

          while (\$true) {
              Write-Host "[\$(Get-Date)] RDP Active - Use Cancel workflow to terminate"
              Start-Sleep -Seconds 300
          }
